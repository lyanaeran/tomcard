# Lance les tests a chaque PR et a chaque push sur main : pytest (src/gameplay, bridge web,
# architecture, tableaux generes) et la syntaxe de la version web.
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependances
        run: pip install -e ".[dev]"
      - name: pytest
        run: pytest
      - name: Syntaxe de la version web
        run: node --check web/app.js && node --check outils/test_web/essais.js
