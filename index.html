<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Space Fight - prototype web</title>
    <link rel="stylesheet" href="web/style.css?v=24">
    <link rel="manifest" href="web/manifest.json?v=24">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b1020">
</head>
<body>
    <div id="statut-chargement">Chargement...</div>
    <div id="app" class="cachee">
        <div id="entete">
            <span id="electricite"></span>
            <div id="boutons-entete">
                <button id="plein-ecran"></button>
                <button id="fin-tour">Fin de tour</button>
            </div>
        </div>
        <div id="conseil-rotation">Tourne ton telephone en mode paysage pour l'affichage complet</div>
        <div id="compteurs-deck"></div>
        <div id="grilles">
            <div id="grille-joueur-conteneur"></div>
            <div id="grille-ennemis-conteneur"></div>
        </div>
        <div id="main"></div>
        <div id="info-carte"></div>
        <div id="info-case"></div>
        <div id="banniere"></div>
    </div>
    <div id="ecran-choix-module" class="cachee">
        <h1>Nouveau module</h1>
        <div id="candidats-module"></div>
        <p class="instruction">Choisissez un nouveau module pour votre vaisseau.</p>
    </div>
    <div id="ecran-fin-combat" class="cachee">
        <h1 id="titre-fin-combat"></h1>
        <p id="message-defaite" class="cachee">Pas d'inquietude : vos restes seront recycles, rien ne se perd dans l'espace.</p>
        <div id="candidats-recompense" class="cachee"></div>
        <p id="instruction-fin-combat" class="instruction cachee">Choisissez une carte a ajouter a votre deck.</p>
    </div>
    <div id="ecran-deck" class="cachee">
        <h1>Deck</h1>
        <div id="grille-deck"></div>
        <div id="info-carte-deck"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
    <script src="web/app.js?v=24"></script>
</body>
</html>
