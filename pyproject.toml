[project]
name = "space-fight"
version = "0.1.0"
description = "Space Fight - deckbuilder roguelike (vaisseaux spatiaux)"
requires-python = ">=3.11"
dependencies = [
    "pyglet>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
